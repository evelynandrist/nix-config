keys:
  - &primary 55B96CBF98D05B66B145428FE264A88262066B52
  - &nixpad e047a92689ed03eb9932070722ce2adfcbedc741
  - &nixserver 84cd2d946f6b71aaa4f1609e5766e1b71b9a8f85
  - &packardserver 8b8039a072ba2ae185e969fddfe8008b7f7a87ae
  # Fill this in with the output of
  #   age-keygen -y ~/.config/sops/age/keys.txt
  # run on the Mac after its first darwin-rebuild switch, then uncomment the
  # matching creation_rule below and flip `bootstrapped` in
  # home-manager/nixbook/sops.nix.
  - &nixbook age15kvzwd5muxku36mgtuzglu6ns9d08lzk504u9rceyyx58rnywv8qpduvh9
creation_rules:
  - path_regex: secrets/secrets.yaml$
    key_groups:
      - pgp:
          - *primary
          - *nixpad
          - *nixserver
          - *packardserver
  - path_regex: secrets/nixbook.yaml$
    key_groups:
      - pgp:
          - *primary
        age:
          - *nixbook
