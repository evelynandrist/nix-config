# Weekly flake.lock bump.
#
# Updates the lock on the branch auto/flake-update, builds every NixOS host
# and evaluates the darwin host against it, then opens a PR (or comments on
# the open one) saying whether it built. It never pushes to main: main
# requires signed commits, so the bump lands when Evelyn squash-merges the
# PR (the bot commit is unsigned, the squash commit GitHub makes is signed).
# The hosts then pick it up through system.autoUpgrade
# (nixos/common/auto-upgrade.nix). A failed build also
# sends the usual GitHub mail.
#
# Run by hand: gh workflow run update-flake.yml
name: Update flake.lock

on:
  schedule:
    - cron: "0 20 * * 0" # Sunday 20:00 UTC, done long before the 04:00 upgrades
  workflow_dispatch:

concurrency:
  group: update-flake
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  BRANCH: auto/flake-update

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.update.outputs.changed }}
      sha: ${{ steps.update.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - id: update
        run: |
          nix flake update 2> >(tee "$RUNNER_TEMP/update.log" >&2)
          if git diff --quiet flake.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # the list of updated inputs becomes the commit body
          {
            echo "chore: update flake.lock"
            echo
            grep -v '^warning:' "$RUNNER_TEMP/update.log" || true
          } > "$RUNNER_TEMP/message"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git commit -F "$RUNNER_TEMP/message" flake.lock
          git push --force origin "$BRANCH"

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        host: [nixpad, nixserver, packardserver, dellserver]
    steps:
      # a system closure is 20+ GiB, more than a runner has free by default
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/share/boost
          df -h /
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.update.outputs.sha }}
      - uses: cachix/install-nix-action@v31
        with:
          # same as nix.settings.sandbox on the hosts (video-paper, steamlink)
          extra_nix_config: |
            sandbox = relaxed
      - run: >
          nix build --no-link --print-build-logs
          ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel"

  # No macOS runner: evaluating catches renamed and removed options, which is
  # most of what breaks.
  eval-nixbook:
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.update.outputs.sha }}
      - uses: cachix/install-nix-action@v31
      - run: nix eval --raw .#darwinConfigurations.nixbook.config.system.build.toplevel.drvPath

  finish:
    needs: [update, build, eval-nixbook]
    if: always() && needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GREEN: ${{ needs.build.result == 'success' && needs.eval-nixbook.result == 'success' }}
    steps:
      # gh needs the checkout to know the repo
      - uses: actions/checkout@v5

      - name: Open or update the PR
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ "$GREEN" = true ]; then
            status="All hosts build and nixbook evaluates: $run_url

          Ready to squash-merge."
          else
            status="The bump did not build or evaluate: $run_url

          Push fixes to this branch and squash-merge, or fix main and wait for next week's run (it overwrites this branch)."
          fi
          if [ "$(gh pr view "$BRANCH" --json state --jq .state 2>/dev/null)" = "OPEN" ]; then
            gh pr comment "$BRANCH" --body "New bump on this branch. $status"
          else
            gh pr create --base main --head "$BRANCH" \
              --title "chore: update flake.lock" \
              --body "$status"
          fi
